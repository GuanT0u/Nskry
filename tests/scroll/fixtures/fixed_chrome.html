<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Scroll capture fixture — fixed chrome</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; background: #1d2026; color: #eee; font: 16px "Segoe UI", sans-serif }
  main { position: absolute; inset: 0 224px 0 246px; background: #232835; display: flex; flex-direction: column }
  aside { position: absolute; top: 0; bottom: 0; width: 246px; border-right: 1px solid #898b99; padding: 16px }
  .right { right: 0; width: 224px; border: 0; border-left: 1px solid #898b99 }
  header, footer { height: 58px; flex: none; padding: 12px; background: #393e51; border-bottom: 2px solid black }
  footer { height: 84px; border: 0; border-top: 2px solid #707383 }
  section { flex: 1; overflow: auto; scrollbar-width: none }
  article { margin: 7px 13px; padding: 7px 16px; background: #333a48; border-left: 3px solid #7198ac }
  button { position: absolute; bottom: 96px; right: 12px; background: #184674; color: white; border: 0; padding: 5px }
</style>
<aside>Navigation<br><br>Home<br>Messages<br>Search</aside>
<aside class="right">Topics<br><br>Following<br>Notifications</aside>
<main>
  <header>Messages / conversations</header>
  <section></section>
  <footer>Message · attach a file</footer>
  <button>↓ Latest</button>
</main>
<script>
  const feed = document.querySelector('section');
  for (let i = 0; i < 90; i++) {
    const message = document.createElement('article');
    message.textContent = 'Message ' + i + ' · ' + 'example message '.repeat(1 + (i * 7) % 6);
    message.style.marginBottom = (7 + i * 3 % 19) + 'px';
    feed.append(message);
  }
  // A pixel offset in the fragment makes the same visible frame reproducible.
  feed.scrollTop = Number(location.hash.slice(1));
</script>
</html>
